schema_version: '1'
connector: archivebox-mcp
ontology_source: archivebox
sync:
- preset: archivebox-snapshots
  server: archivebox-mcp
  tool: archivebox_get_snapshots
  records_path: items
  id_field: id
  title_field: url
  text_field: title
  updated_field: modified_at
  doc_type: web_snapshot
governance:
  default_acl: quarantine
  identity: opaque-reference
  tenant: required-at-materialization
  provenance: required-at-materialization
